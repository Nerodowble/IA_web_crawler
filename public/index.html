<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat IA</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { max-width: 760px; margin: 0 auto; padding: 32px 18px; background: #10131a; color: #f4f5f7; }
      h1 { margin-bottom: 6px; }
      p { color: #aeb6c4; }
      form { display: grid; gap: 12px; margin-top: 28px; }
      textarea { min-height: 130px; resize: vertical; padding: 12px; border: 1px solid #394252; border-radius: 8px; background: #191e27; color: inherit; font: inherit; }
      select { width: fit-content; padding: 10px; border: 1px solid #394252; border-radius: 8px; background: #191e27; color: inherit; font: inherit; }
      button { width: fit-content; padding: 10px 18px; border: 0; border-radius: 8px; background: #5b8cff; color: white; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      pre { white-space: pre-wrap; padding: 16px; border-radius: 8px; background: #191e27; line-height: 1.5; }
      #status { min-height: 1.4em; color: #aeb6c4; }
    </style>
  </head>
  <body>
    <h1>Chat IA</h1>
    <p>Uma interface mínima para testar seu endpoint local.</p>
    <form id="chat-form">
      <label for="provider">Provedor</label>
      <select id="provider">
        <option value="gemini">Gemini</option>
        <option value="chatgpt">ChatGPT</option>
        <option value="duckai">Duck.ai</option>
      </select>
      <textarea id="message" placeholder="Digite sua pergunta..." required></textarea>
      <button type="submit">Enviar</button>
    </form>
    <p id="status"></p>
    <pre id="answer" hidden></pre>
    <script>
      const form = document.querySelector('#chat-form');
      const message = document.querySelector('#message');
      const provider = document.querySelector('#provider');
      const status = document.querySelector('#status');
      const answer = document.querySelector('#answer');
      const button = form.querySelector('button');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        button.disabled = true;
        status.textContent = 'Consultando o modelo...';
        answer.hidden = true;

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message.value, provider: provider.value })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Erro inesperado.');
          answer.textContent = data.answer;
          answer.hidden = false;
          status.textContent = `Provedor: ${data.provider}`;
        } catch (error) {
          status.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
